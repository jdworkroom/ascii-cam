<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>ASCII CAM</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
body{display:flex;flex-direction:column;height:100dvh;
  padding:calc(env(safe-area-inset-top) + 12px) 0 calc(env(safe-area-inset-bottom) + 10px)}
#vid{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none}

/* 두 컷 프레임 */
#flip{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:14px;z-index:2;width:40px;height:40px;border-radius:50%;
  border:none;background:#1c1c1ee6;font-size:19px;display:flex;align-items:center;justify-content:center}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 6px 0}
#cv{max-width:100%;max-height:100%;aspect-ratio:9/16;border-radius:6px;background:#0b0b0b;
  box-shadow:0 0 0 1px #222,0 18px 50px #000}

/* 하단 바: 설정 · 셔터 · 복사 */
#bar{flex:none;height:96px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 28px}
.side{justify-self:start;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:none;
  font-size:11px;color:#fffb;padding:6px}
.side:last-child{justify-self:end}
.side i{width:42px;height:42px;border-radius:50%;background:#1c1c1e;display:flex;align-items:center;justify-content:center;
  font-style:normal;font-size:18px;color:#fff}
#shutter{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:none;padding:4px;display:flex}
#shutter b{flex:1;border-radius:50%;background:#fff;transition:transform .12s}
#shutter:active b{transform:scale(.88)}

/* 설정 시트 */
#dim{position:fixed;inset:0;background:#0008;opacity:0;pointer-events:none;transition:opacity .2s}
#sheet{position:fixed;left:0;right:0;bottom:0;background:#1c1c1e;border-radius:18px 18px 0 0;
  padding:10px 20px calc(env(safe-area-inset-bottom) + 22px);transform:translateY(105%);transition:transform .25s ease;
  display:flex;flex-direction:column;gap:16px;font-size:13px}
body.open #sheet{transform:none}
body.open #dim{opacity:1;pointer-events:auto}
#sheet .grab{width:36px;height:5px;border-radius:3px;background:#48484a;margin:0 auto 2px}
#sheet h3{margin:0;font-size:15px;display:flex;justify-content:space-between;align-items:center}
#sheet h3 button{border:none;background:none;color:#0a84ff;font-size:15px;font-weight:600;padding:0}
.field{display:flex;flex-direction:column;gap:8px}
.field > span{color:#fff9;font-size:12px}
.seg{display:flex;background:#2c2c2e;border-radius:9px;padding:2px}
.seg button{flex:1;border:none;background:none;border-radius:7px;padding:7px 0;font-size:13px;font-weight:600;color:#fffb}
.seg button.on{background:#636366;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid #3a3a3c;background:none;border-radius:999px;padding:6px 13px;font-size:13px;color:#fffc}
.chips button.on{background:#fff;color:#000;border-color:#fff}
.colors{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:50%;border:none;padding:0;box-shadow:inset 0 0 0 1px #fff3}
.colors button.on{box-shadow:0 0 0 2px #1c1c1e,0 0 0 4px #fff}
#customBg{position:relative;width:30px;height:30px;border-radius:50%;overflow:hidden;
  background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
#customBg.on{box-shadow:0 0 0 2px #1c1c1e,0 0 0 4px #fff}
#customBg input{position:absolute;inset:-8px;width:46px;height:46px;opacity:0;border:none;padding:0}
.slider{display:flex;align-items:center;gap:12px}
.slider input{flex:1;accent-color:#fff}
.slider output{width:32px;text-align:right;font-variant-numeric:tabular-nums}

#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 20px);transform:translateX(-50%);
  background:#1c1c1ee6;padding:8px 14px;border-radius:999px;font-size:12.5px;display:none;white-space:nowrap}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:#000;text-align:center;padding:24px}
#start p{margin:0;font-size:13px;color:#fff9;max-width:280px;line-height:1.6}
#go{border:none;background:#fff;color:#000;font-weight:700;font-size:15px;border-radius:999px;padding:12px 26px}
</style>
</head>
<body>
<button id="flip" aria-label="카메라 전환">⟲</button>
<div id="stage"><canvas id="cv" width="720" height="1280"></canvas></div>
<video id="vid" playsinline muted autoplay></video>

<div id="bar">
  <button class="side" id="bCfg"><i>⚙︎</i>설정</button>
  <button id="shutter" aria-label="촬영"><b></b></button>
  <button class="side" id="bCopy"><i>⧉</i>복사</button>
</div>

<div id="dim"></div>
<div id="sheet">
  <div class="grab"></div>
  <h3>설정 <button id="bDone">완료</button></h3>
  <div class="field"><span>표현</span>
    <div class="seg" id="segMode"><button data-m="ascii" class="on">문자</button><button data-m="emoji">이모지</button></div>
  </div>
  <div class="field" id="fSet"><span>문자 범위</span><div class="chips" id="chips"></div></div>
  <div class="field"><span>아래 칸 배경색</span>
    <div class="colors" id="bgColors">
      <button data-c="#000000" style="background:#000" class="on"></button>
      <button data-c="#ffffff" style="background:#fff"></button>
      <button data-c="#0b1a3a" style="background:#0b1a3a"></button>
      <button data-c="#1f5c3a" style="background:#1f5c3a"></button>
      <button data-c="#e0322b" style="background:#e0322b"></button>
      <button data-c="#ffd60a" style="background:#ffd60a"></button>
      <button data-c="#ff8fc6" style="background:#ff8fc6"></button>
      <label id="customBg" aria-label="직접 고르기"><input id="bgPick" type="color" value="#3355ff"></label>
    </div></div>
  <div class="field"><span>크기</span>
    <div class="slider"><input id="sSize" type="range" min="6" max="80" step="1" value="37"><output id="oSize">37</output></div></div>
  <div class="field"><span>대비</span>
    <div class="slider"><input id="sCon" type="range" min="0.5" max="3" step="0.05" value="1.4"><output id="oCon">1.4</output></div></div>
</div>

<div id="flash"></div>
<div id="toast"></div>
<div id="start">
  <p id="msg">위 칸에는 흑백 사진, 아래 칸에는 글자로 그린 내가 나와요.</p>
  <button id="go">카메라 켜기</button>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d', { alpha: false });
const vid = $('#vid');
const off = document.createElement('canvas');
const octx = off.getContext('2d', { willReadFrequently: true });

const W = 720, H = 1280;
// 두 컷 프레임 배치
const PAD = 20, GAP = 12, FOOT = 56;
const CW = W - PAD * 2, CH = Math.floor((H - PAD - GAP - FOOT) / 2);
const CUT1 = { x: PAD, y: PAD }, CUT2 = { x: PAD, y: PAD + CH + GAP };
function clipRound(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.clip();
}
// 문자 범위 (순서는 상관없음: 획 양을 재서 자동으로 밝기 순 정렬)
const MONO = 'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
const SETS = [
  { name: '기본', chars: '.-*#', font: MONO, w: 0.6 },
  { name: '코드', chars: '.:;,\'"`-_~^()[]{}<>=+/\\|!?*&%$#@', font: MONO, w: 0.6 },
  { name: '영문', chars: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ', font: MONO, w: 0.6 },
  { name: '한글', chars: 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ',
    font: '"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",sans-serif', w: 1 },
  { name: '숫자', chars: '0123456789', font: MONO, w: 0.6 }
];
// 각 문자 집합: 글자마다 잉크 양을 재고, 밝기(0~255) → 글자 표를 만든다
function prepSet(set) {
  const S = 64, c = document.createElement('canvas'); c.width = Math.ceil(S * set.w); c.height = S;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.font = `${S * 0.9}px ${set.font}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#fff';
  const glyphs = [...new Set([...set.chars])].map(g => {
    x.clearRect(0, 0, c.width, c.height); x.fillText(g, c.width / 2, S / 2);
    const d = x.getImageData(0, 0, c.width, c.height).data; let sum = 0;
    for (let i = 3; i < d.length; i += 4) sum += d[i];
    return { g, v: sum };
  }).sort((a, b) => a.v - b.v);
  const lo = glyphs[0].v, hi = glyphs[glyphs.length - 1].v || 1;
  glyphs.forEach(o => o.n = (o.v - lo) / Math.max(1, hi - lo));
  const blank = set.w === 1 ? '\u3000' : ' ';        // 가장 어두운 곳은 비워서 검은 배경이 보이게 (기본 세트 제외)
  set.lut = Array.from({ length: 256 }, (_, i) => {
    if (set.name !== '기본' && i < 30) return blank;
    const t = (set.name === '기본' ? i : (i - 30) * 255 / 225) / 255; let best = glyphs[0], bd = 9;
    for (const o of glyphs) { const dd = Math.abs(o.n - t); if (dd < bd) { bd = dd; best = o; } }
    return best.g;
  });
}
SETS.forEach(prepSet);
// 사물 이모지와 대표 색
const EMOJI = [
  ['🖤', 20, 20, 22], ['🎱', 45, 45, 50], ['🩶', 140, 140, 145], ['🤍', 240, 240, 240], ['🥚', 235, 220, 190],
  ['🍎', 215, 40, 40], ['🍓', 230, 60, 75], ['🍊', 245, 140, 30], ['🍑', 250, 175, 135], ['🍋', 250, 215, 60],
  ['🍏', 145, 205, 60], ['🥦', 65, 140, 55], ['🫐', 60, 85, 165], ['🧊', 175, 215, 240], ['🍇', 130, 65, 150],
  ['🍆', 85, 40, 95], ['🌸', 245, 185, 205], ['🥥', 125, 85, 55], ['🍫', 80, 45, 30], ['🍞', 210, 160, 95]
];

let facing = 'user', mirror = true, stream = null;
let bg = '#000000', bgLight = false;                 // 아래 칸 배경색 (밝으면 글자는 검정, 명암 반전)
let mode = 'ascii', set = 0, contrast = 1.4, ready = false, lastT = 0;
const sizes = { ascii: 37, emoji: 22 };
const RANGE = { ascii: [6, 80], emoji: [12, 60] };
let lastText = '';

// 색 → 이모지 번호 표 (32단계 x 3)
const LUT = new Uint8Array(32 * 32 * 32);
for (let r = 0; r < 32; r++) for (let g = 0; g < 32; g++) for (let b = 0; b < 32; b++) {
  const R = r * 8 + 4, G = g * 8 + 4, B = b * 8 + 4;
  let best = 0, bd = 1e9;
  EMOJI.forEach((e, i) => {
    const dr = R - e[1], dg = G - e[2], db = B - e[3];
    const dd = 2 * dr * dr + 4 * dg * dg + 3 * db * db;
    if (dd < bd) { bd = dd; best = i; }
  });
  LUT[(r << 10) | (g << 5) | b] = best;
}

// 이모지를 칸 크기로 미리 그려 두기
let sprites = [], spriteSize = 0;
function buildSprites(s) {
  spriteSize = s;
  sprites = EMOJI.map(e => {
    const c = document.createElement('canvas'); c.width = c.height = Math.ceil(s);
    const x = c.getContext('2d');
    x.font = `${s * 0.86}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(e[0], s / 2, s / 2 + s * 0.04);
    return c;
  });
}

function cover(c, v, w, h, ta) {
  const vw = v.videoWidth || v.width, vh = v.videoHeight || v.height;
  if (!vw || !vh) return;
  let sx = 0, sy = 0, sw = vw, sh = vh;
  if (vw / vh > ta) { sw = vh * ta; sx = (vw - sw) / 2; } else { sh = vw / ta; sy = (vh - sh) / 2; }
  c.save();
  if (mirror) { c.translate(w, 0); c.scale(-1, 1); }   // 전면은 셀카처럼 좌우 반전
  c.drawImage(v, sx, sy, sw, sh, 0, 0, w, h); c.restore();
}
const clamp = v => v < 0 ? 0 : v > 255 ? 255 : v;

// ---------- 인물 분리 (MediaPipe Selfie Segmenter) ----------
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.3';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';
let seg = null, segState = 'off';                     // off → loading → on / fail
const segCv = document.createElement('canvas'), segCtx = segCv.getContext('2d');
const maskCv = document.createElement('canvas'), maskCtx = maskCv.getContext('2d');
const gmCv = document.createElement('canvas'), gmCtx = gmCv.getContext('2d', { willReadFrequently: true });
let maskImg = null, cellMask = null, lastTs = 0;

async function loadSeg() {
  if (segState !== 'off') return;
  segState = 'loading'; toast('인물 인식 준비 중…', 4000);
  try {
    const { FilesetResolver, ImageSegmenter } = await import(`${MP}/vision_bundle.mjs`);
    const files = await FilesetResolver.forVisionTasks(`${MP}/wasm`);
    const make = delegate => ImageSegmenter.createFromOptions(files, {
      baseOptions: { modelAssetPath: MODEL, delegate },
      runningMode: 'VIDEO', outputConfidenceMasks: true, outputCategoryMask: false });
    try { seg = await make('GPU'); } catch (e) { seg = await make('CPU'); }
    segState = 'on'; toast('인물만 보여요');
  } catch (e) {
    console.error(e); segState = 'fail'; toast('인물 인식을 불러오지 못해서 전체 화면으로 보여요', 3000);
  }
}

// 프레임마다: 작은 해상도로 인물 확률을 구해서 칸(cols x rows) 단위 마스크로 만든다
function updateMask(cols, rows, ta) {
  const vw = vid.videoWidth, vh = vid.videoHeight;
  if (!vw || !vh) return null;
  const sw = 256, sh = Math.round(256 * vh / vw);
  if (segCv.width !== sw || segCv.height !== sh) {
    segCv.width = maskCv.width = sw; segCv.height = maskCv.height = sh;
    maskImg = maskCtx.createImageData(sw, sh);
  }
  segCtx.drawImage(vid, 0, 0, sw, sh);
  const ts = Math.max(performance.now(), lastTs + 1); lastTs = ts;
  const res = seg.segmentForVideo(segCv, ts);
  const m = res.confidenceMasks && res.confidenceMasks[0];
  if (!m) { res.close && res.close(); return null; }
  const f = m.getAsFloat32Array(), a = maskImg.data;
  for (let i = 0; i < f.length; i++) { const j = i * 4; a[j] = a[j + 1] = a[j + 2] = 255; a[j + 3] = f[i] * 255; }
  res.close ? res.close() : m.close();
  maskCtx.putImageData(maskImg, 0, 0);

  if (gmCv.width !== cols || gmCv.height !== rows) { gmCv.width = cols; gmCv.height = rows; cellMask = null; }
  gmCtx.clearRect(0, 0, cols, rows);
  cover(gmCtx, maskCv, cols, rows, ta);
  const g = gmCtx.getImageData(0, 0, cols, rows).data;
  if (!cellMask || cellMask.length !== cols * rows) cellMask = new Float32Array(cols * rows);
  for (let i = 0; i < cols * rows; i++) cellMask[i] = cellMask[i] * .4 + (g[i * 4 + 3] / 255) * .6;   // 깜빡임 줄이기
  return cellMask;
}

function draw() {
  ctx.fillStyle = '#0b0b0b'; ctx.fillRect(0, 0, W, H);           // 프레임
  ctx.fillStyle = '#000';
  ctx.fillRect(CUT1.x, CUT1.y, CW, CH);
  ctx.fillStyle = bg; ctx.fillRect(CUT2.x, CUT2.y, CW, CH);
  ctx.fillStyle = '#5a5a5a'; ctx.font = `600 16px ${MONO}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('A S C I I   C A M', W / 2, CUT2.y + CH + FOOT / 2);
  if (!ready) return;

  // 1컷: 흑백 사진
  ctx.save(); clipRound(CUT1.x, CUT1.y, CW, CH, 4); ctx.translate(CUT1.x, CUT1.y);
  cover(ctx, vid, CW, CH, CW / CH);
  ctx.globalCompositeOperation = 'saturation'; ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, CW, CH);
  ctx.restore();

  // 2컷: 글자로 그린 인물
  ctx.save(); clipRound(CUT2.x, CUT2.y, CW, CH, 4);
  const size = sizes[mode];
  const cs = SETS[set];
  const cw = mode === 'emoji' ? size : size * cs.w, ch = size;
  const cols = Math.max(1, Math.floor(CW / cw)), rows = Math.max(1, Math.floor(CH / ch));
  if (off.width !== cols || off.height !== rows) { off.width = cols; off.height = rows; }
  const ta = (cols * cw) / (rows * ch);
  cover(octx, vid, cols, rows, ta);
  const d = octx.getImageData(0, 0, cols, rows).data;
  let mask = null;
  if (segState === 'on') { try { mask = updateMask(cols, rows, ta); } catch (e) { console.error(e); } }
  const ox = CUT2.x + (CW - cols * cw) / 2, oy = CUT2.y + (CH - rows * ch) / 2;
  const lines = [];

  if (mode === 'ascii') {
    const lut = cs.lut;
    ctx.fillStyle = bgLight ? '#000' : '#fff';
    ctx.font = `${size * (cs.w === 1 ? 0.9 : 1)}px ${cs.font}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let r = 0; r < rows; r++) {
      let line = '';
      for (let c = 0; c < cols; c++) {
        const k = (r * cols + c) * 4;
        if (mask && mask[r * cols + c] < .5) { line += cs.w === 1 ? '\u3000' : ' '; continue; }
        let l = (0.299 * d[k] + 0.587 * d[k + 1] + 0.114 * d[k + 2]) / 255;
        l = (l - .5) * contrast + .5;
        if (bgLight) l = 1 - l;                          // 밝은 배경: 어두운 곳을 진한 글자로
        const g = lut[Math.max(0, Math.min(255, Math.round(l * 255)))];
        line += g;
        if (g !== ' ' && g !== '\u3000') ctx.fillText(g, ox + c * cw + cw / 2, oy + r * ch + ch / 2);
      }
      lines.push(line);
    }
  } else {
    if (spriteSize !== size) buildSprites(size);
    for (let r = 0; r < rows; r++) {
      let line = '';
      for (let c = 0; c < cols; c++) {
        const k = (r * cols + c) * 4;
        if (mask && mask[r * cols + c] < .5) { line += '\u3000'; continue; }
        const R = clamp((d[k] - 128) * contrast + 128), G = clamp((d[k + 1] - 128) * contrast + 128), B = clamp((d[k + 2] - 128) * contrast + 128);
        const i = LUT[((R >> 3) << 10) | ((G >> 3) << 5) | (B >> 3)];
        line += EMOJI[i][0];
        ctx.drawImage(sprites[i], ox + c * cw, oy + r * ch);
      }
      lines.push(line);
    }
  }
  ctx.restore();
  lastText = lines.join('\n');
}

function loop(t) { requestAnimationFrame(loop); if (t - lastT >= 30) { lastT = t; draw(); } }
requestAnimationFrame(loop);

// ---------- 카메라 ----------
async function startCam() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    $('#msg').textContent = '카메라는 HTTPS 주소에서만 켜져요.'; return;
  }
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    vid.srcObject = stream; await vid.play();
    const st = stream.getVideoTracks()[0].getSettings ? stream.getVideoTracks()[0].getSettings() : {};
    mirror = (st.facingMode || facing) !== 'environment';
    cellMask = null;
    ready = true; $('#start').style.display = 'none';
    loadSeg();
  } catch (e) {
    $('#msg').textContent = e && e.name === 'NotAllowedError'
      ? '카메라 권한이 막혀 있어요. 브라우저 설정에서 허용해 주세요.'
      : '카메라를 켜지 못했어요.';
  }
}
$('#go').onclick = startCam;
$('#flip').onclick = async () => {
  if (!ready) return;
  facing = facing === 'user' ? 'environment' : 'user';
  await startCam();
  if (ready && stream) {
    const got = (stream.getVideoTracks()[0].getSettings() || {}).facingMode;
    if (got && got !== facing) toast('다른 카메라를 찾지 못했어요');
  }
};

// ---------- 설정 시트 ----------
const body = document.body;
$('#bCfg').onclick = () => body.classList.add('open');
$('#bDone').onclick = $('#dim').onclick = () => body.classList.remove('open');
SETS.forEach((cs, i) => {
  const b = document.createElement('button'); b.textContent = cs.name; if (i === set) b.className = 'on';
  b.onclick = () => { set = i; syncUI(); };
  $('#chips').appendChild(b);
});
function syncSize() {
  const s = $('#sSize'); s.min = RANGE[mode][0]; s.max = RANGE[mode][1];
  s.value = sizes[mode]; $('#oSize').textContent = sizes[mode];
}
$('#sSize').oninput = e => { sizes[mode] = +e.target.value; $('#oSize').textContent = sizes[mode]; };
$('#sCon').oninput = e => { contrast = +e.target.value; $('#oCon').textContent = contrast.toFixed(1); };
function setBg(c, el) {
  bg = c;
  const n = parseInt(c.slice(1), 16), L = (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255;
  bgLight = L > 0.55;
  document.querySelectorAll('#bgColors button').forEach(b => b.classList.toggle('on', b === el));
  $('#customBg').classList.toggle('on', el === $('#customBg'));
}
document.querySelectorAll('#bgColors button').forEach(b => b.onclick = () => setBg(b.dataset.c, b));
$('#bgPick').oninput = e => setBg(e.target.value, $('#customBg'));
function syncUI() {
  [...$('#segMode').children].forEach(x => x.classList.toggle('on', x.dataset.m === mode));
  [...$('#chips').children].forEach((x, j) => x.classList.toggle('on', j === set));
  $('#fSet').style.display = mode === 'ascii' ? '' : 'none';
  syncSize();
}
$('#segMode').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  mode = b.dataset.m; syncUI();
};

// 아래 칸을 탭하면 글자 종류가 바뀜: 기본 → 코드 → 영문 → 한글 → 숫자 → 이모지 → 기본 …
$('#cv').addEventListener('click', e => {
  if (!ready) return;
  const r = cv.getBoundingClientRect(), y = (e.clientY - r.top) / r.height * H;
  if (y < CUT2.y || y > CUT2.y + CH) return;
  if (mode === 'emoji') { mode = 'ascii'; set = 0; }
  else if (set === SETS.length - 1) mode = 'emoji';
  else set++;
  syncUI();
  toast(mode === 'emoji' ? '이모지' : SETS[set].name, 900);
});

let toastTimer;
function toast(m, ms = 1800) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', ms); }

// ---------- 복사: 지금 화면의 문자/이모지를 텍스트로 ----------
$('#bCopy').onclick = async () => {
  if (!ready || !lastText) return;
  const text = lastText;
  try { await navigator.clipboard.writeText(text); toast('복사했어요'); return; } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  const ok = document.execCommand && document.execCommand('copy'); ta.remove();
  toast(ok ? '복사했어요' : '복사하지 못했어요');
};

// ---------- 촬영: 지금 화면(UI 제외)을 PNG로 ----------
$('#shutter').onclick = () => {
  if (!ready) return;
  const f = $('#flash'); f.style.transition = 'none'; f.style.opacity = '.8';
  requestAnimationFrame(() => { f.style.transition = 'opacity .25s'; f.style.opacity = '0'; });
  cv.toBlob(async blob => {
    if (!blob) return;
    const d = new Date(), p = n => String(n).padStart(2, '0');
    const name = `ascii-cam-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.png`;
    const file = new File([blob], name, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }, 'image/png');
};
})();
</script>
</body>
