<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>ASCII CAM</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#cv{position:fixed;inset:0;width:100vw;height:100dvh;object-fit:cover;display:block;background:#000}
#vid{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none}
#panel{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);
  width:min(92vw,360px);display:flex;flex-direction:column;gap:10px;padding:12px 16px;border-radius:16px;
  background:#000a;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12px}
#panel label{display:flex;align-items:center;gap:10px}
#panel label span{width:48px;flex:none;color:#fffc}
#panel input{flex:1;accent-color:#fff}
#panel output{width:30px;text-align:right;font-variant-numeric:tabular-nums}
#shutter{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 112px);transform:translateX(-50%);
  width:70px;height:70px;border-radius:50%;border:4px solid #fff;background:none;padding:4px;display:flex}
#shutter i{flex:1;border-radius:50%;background:#fff;transition:transform .12s}
#shutter:active i{transform:scale(.88)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:#000;text-align:center;padding:24px}
#start p{margin:0;font-size:13px;color:#fff9;max-width:280px;line-height:1.6}
#go{border:none;background:#fff;color:#000;font:inherit;font-weight:700;font-size:15px;border-radius:999px;padding:12px 26px}
</style>
</head>
<body>
<canvas id="cv" width="720" height="1280"></canvas>
<video id="vid" playsinline muted autoplay></video>

<div id="panel">
  <label><span>글자 크기</span><input id="sSize" type="range" min="6" max="28" step="1" value="12"><output id="oSize">12</output></label>
  <label><span>대비</span><input id="sCon" type="range" min="0.5" max="3" step="0.05" value="1.4"><output id="oCon">1.4</output></label>
</div>

<button id="shutter" aria-label="촬영"><i></i></button>
<div id="flash"></div>

<div id="start">
  <p id="msg">카메라를 켜면 위에는 원본, 아래에는 ASCII가 나와요.</p>
  <button id="go">카메라 켜기</button>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d', { alpha: false });
const vid = $('#vid');
const off = document.createElement('canvas');
const octx = off.getContext('2d', { willReadFrequently: true });

const W = 720, H = 1280, P = H / 2;
const RAMP = '.-*#';          // 어두움 → 밝음
let size = 12, contrast = 1.4, ready = false, lastT = 0;

function cover(c, v, w, h, ta) {
  const vw = v.videoWidth, vh = v.videoHeight;
  if (!vw || !vh) return;
  let sx = 0, sy = 0, sw = vw, sh = vh;
  if (vw / vh > ta) { sw = vh * ta; sx = (vw - sw) / 2; } else { sh = vw / ta; sy = (vh - sh) / 2; }
  c.save(); c.translate(w, 0); c.scale(-1, 1);       // 셀카처럼 좌우 반전
  c.drawImage(v, sx, sy, sw, sh, 0, 0, w, h); c.restore();
}

function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (!ready) return;
  cover(ctx, vid, W, P, W / P);                       // 위: 원본

  const cw = size * 0.6, ch = size;                   // 고정폭 글자 비율
  const cols = Math.floor(W / cw), rows = Math.floor(P / ch);
  if (off.width !== cols || off.height !== rows) { off.width = cols; off.height = rows; }
  cover(octx, vid, cols, rows, (cols * cw) / (rows * ch));
  const d = octx.getImageData(0, 0, cols, rows).data;

  const ox = (W - cols * cw) / 2, oy = P + (P - rows * ch) / 2;
  ctx.fillStyle = '#fff';
  ctx.font = `${size}px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const n = RAMP.length;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const k = (r * cols + c) * 4;
      let l = (0.299 * d[k] + 0.587 * d[k + 1] + 0.114 * d[k + 2]) / 255;
      l = (l - .5) * contrast + .5;
      const i = Math.max(0, Math.min(n - 1, Math.floor(l * n)));
      ctx.fillText(RAMP[i], ox + c * cw + cw / 2, oy + r * ch + ch / 2);
    }
  }
}

function loop(t) { requestAnimationFrame(loop); if (t - lastT >= 30) { lastT = t; draw(); } }
requestAnimationFrame(loop);

async function startCam() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    $('#msg').textContent = '카메라는 HTTPS 주소에서만 켜져요.'; return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    vid.srcObject = stream; await vid.play();
    ready = true; $('#start').style.display = 'none';
  } catch (e) {
    $('#msg').textContent = e && e.name === 'NotAllowedError'
      ? '카메라 권한이 막혀 있어요. 브라우저 설정에서 허용해 주세요.'
      : '카메라를 켜지 못했어요.';
  }
}
$('#go').onclick = startCam;

// 촬영: 지금 화면(UI 제외)을 PNG로 저장 / 공유
$('#shutter').onclick = () => {
  if (!ready) return;
  const f = $('#flash'); f.style.transition = 'none'; f.style.opacity = '.8';
  requestAnimationFrame(() => { f.style.transition = 'opacity .25s'; f.style.opacity = '0'; });
  cv.toBlob(async blob => {
    if (!blob) return;
    const d = new Date(), p = n => String(n).padStart(2, '0');
    const name = `ascii-cam-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.png`;
    const file = new File([blob], name, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }, 'image/png');
};
$('#sSize').oninput = e => { size = +e.target.value; $('#oSize').textContent = size; };
$('#sCon').oninput = e => { contrast = +e.target.value; $('#oCon').textContent = contrast.toFixed(1); };
})();
</script>
</body>
</html>
