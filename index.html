<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05080f">
<title>ASCII CAM</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05080f;color:#bfeccf;overscroll-behavior:none;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Apple SD Gothic Neo","Noto Sans KR",monospace}
button,input,textarea{font:inherit;color:inherit}
#app{height:100dvh;display:flex;flex-direction:column;gap:10px;
  padding:max(10px,env(safe-area-inset-top)) 10px max(12px,env(safe-area-inset-bottom))}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
#cv{max-width:100%;max-height:100%;border-radius:14px;background:#050a14;
  box-shadow:0 0 0 1px #13361f,0 12px 40px #000a}
#vid{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none}

#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;text-align:center;padding:24px}
#start pre{margin:0;font-size:11px;line-height:1.1;color:#4cff8f;text-shadow:0 0 12px #1f8f4f}
#start p{margin:0;font-size:13px;line-height:1.6;color:#7fb897;max-width:290px}
#err{color:#ff8a8a !important;display:none}

.row{display:flex;gap:8px;align-items:stretch}
.chip{flex:1;border:1px solid #1d3f2b;background:#0a1510;border-radius:12px;padding:10px 6px;
  font-size:12.5px;white-space:nowrap;cursor:pointer;color:#9fe8b8}
.chip:active{background:#12301f}
.chip b{color:#4cff8f}
.big{flex:1;border-radius:14px;padding:15px 10px;font-weight:700;font-size:15px;cursor:pointer;border:1px solid #2a6e44;
  background:#0f2a1a;color:#6dffa6}
.big:active{transform:scale(.98)}
.big.rec{border-color:#7a2630;background:#2a0f14;color:#ff7a8a}
.big.recording{background:#d92d44;color:#fff;border-color:#ff7a8a}
.big:disabled,.chip:disabled{opacity:.4}
#go{border:1px solid #2a6e44;background:#0f2a1a;color:#6dffa6;font-weight:700;font-size:16px;
  border-radius:14px;padding:14px 26px;cursor:pointer}

#drawer{display:none;border:1px solid #1d3f2b;background:#08120d;border-radius:14px;padding:12px 14px;
  font-size:12.5px;flex-direction:column;gap:10px}
#drawer.open{display:flex}
#drawer label{display:flex;align-items:center;gap:10px;color:#8fd1a8}
#drawer label span:first-child{width:56px;flex:none}
#drawer input[type=range]{flex:1;accent-color:#4cff8f}
#drawer output{width:34px;text-align:right;color:#4cff8f}
#drawer textarea{flex:1;background:#0a1510;border:1px solid #1d3f2b;border-radius:8px;padding:8px;resize:none}
.seg{display:flex;gap:6px}
.seg button{border:1px solid #1d3f2b;background:#0a1510;border-radius:8px;padding:6px 12px;cursor:pointer;color:#9fe8b8}
.seg button.on{background:#12301f;color:#4cff8f;border-color:#2a6e44}

#modal{position:fixed;inset:0;background:#000d;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:20px;z-index:10}
#modal.open{display:flex}
#modal .media{max-width:100%;max-height:calc(100dvh - 190px);border-radius:12px;box-shadow:0 0 0 1px #13361f}
#modal .hint{font-size:12px;color:#7fb897;text-align:center}
#modal .row{width:100%;max-width:420px}
#toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:#0f2a1a;border:1px solid #2a6e44;color:#bfffd6;padding:9px 14px;border-radius:10px;font-size:12.5px;
  display:none;z-index:20;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="720" height="1280"></canvas>
    <video id="vid" playsinline muted autoplay></video>
    <div id="start">
<pre>   *
  /#\
 /###\
/#####\
  |_|</pre>
      <p>위에는 카메라, 아래에는 실시간 ASCII 변환.<br>촬영하거나 녹화해서 바로 인스타에 올려요.</p>
      <p id="err"></p>
      <button id="go">카메라 켜기</button>
    </div>
  </div>

  <div id="drawer">
    <label><span>글자 수</span><input id="sCols" type="range" min="50" max="160" step="2" value="90"><output id="oCols">90</output></label>
    <label><span>대비</span><input id="sCon" type="range" min="0.7" max="2.2" step="0.05" value="1.35"><output id="oCon">1.35</output></label>
    <label><span>밝기</span><input id="sBri" type="range" min="-0.3" max="0.3" step="0.02" value="0"><output id="oBri">0</output></label>
    <label><span>화질</span><span class="seg" id="segQ"><button data-w="720" class="on">720</button><button data-w="1080">1080</button></span></label>
    <label><span>눈</span><span class="seg" id="segSnow"><button data-v="1" class="on">ON</button><button data-v="0">OFF</button></span></label>
    <label><span>캡션</span><textarea id="tCap" rows="2" placeholder="아래쪽에 크게 들어가는 글자"></textarea></label>
  </div>

  <div class="row">
    <button class="chip" id="bFlip">카메라 전환</button>
    <button class="chip" id="bMode">스타일 <b id="lMode">TREE</b></button>
    <button class="chip" id="bSet">문자 <b id="lSet">ABC</b></button>
    <button class="chip" id="bCfg">설정</button>
  </div>
  <div class="row">
    <button class="big" id="bShot">사진 찍기</button>
    <button class="big rec" id="bRec">녹화 시작</button>
  </div>
</div>

<div id="modal">
  <div id="mediaBox"></div>
  <div class="hint" id="mHint"></div>
  <div class="row">
    <button class="big" id="mSave">저장 / 공유</button>
    <button class="chip" id="mClose">닫기</button>
  </div>
</div>
<div id="toast"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d', { alpha: false });
const vid = $('#vid');
const off = document.createElement('canvas');
const octx = off.getContext('2d', { willReadFrequently: true });

const S = { W: 720, H: 1280, cols: 90, contrast: 1.35, bright: 0, mode: 0, set: 0,
            snow: true, facing: 'user', caption: '// merry christmas' };
const MODES = ['TREE', 'COLOR', 'TERMINAL', 'MONO'];
const SETS = [' .:-=+*#%@', ' .,:;i!l/(){}[]<>+=*#%&@', ' 01'];
const SET_LABELS = ['ABC', 'CODE', '0/1'];
const SPARK = ['#ffd34d', '#ff4d5e', '#ffffff', '#ff9ad5'];
const CODE = [
  'rng = np.random.default_rng(7)',
  'q = Parts()',
  'tips = []',
  'for y in range(rows):',
  '    row = frame[y]',
  '    for x, px in enumerate(row):',
  '        ch = RAMP[int(px * 9)]',
  '        q.put(x, y, ch)',
  'tips.append(sparkle(q))',
  'render(q, fps=30)',
];
$('#tCap').value = S.caption;

let ready = false, stream = null, mirror = true;
let prev = null, pw = 0, ph = 0;
let lastT = 0, fps = 30, fCount = 0, fTime = performance.now();
const snow = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), v: .05 + Math.random() * .09, s: .6 + Math.random() }));

function setSize(w) {
  S.W = w; S.H = Math.round(w * 16 / 9 / 2) * 2;
  cv.width = S.W; cv.height = S.H; prev = null;
}

function hash(a, b, c) {
  let h = Math.imul(a, 374761393) + Math.imul(b, 668265263) + Math.imul(c, 1274126177) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

function cover(c, v, x, y, w, h, flip, ta) {
  const vw = v.videoWidth, vh = v.videoHeight;
  if (!vw || !vh) return;
  ta = ta || w / h;
  const va = vw / vh;
  let sx = 0, sy = 0, sw = vw, sh = vh;
  if (va > ta) { sw = vh * ta; sx = (vw - sw) / 2; } else { sh = vw / ta; sy = (vh - sh) / 2; }
  c.save();
  if (flip) { c.translate(x + w, y); c.scale(-1, 1); c.drawImage(v, sx, sy, sw, sh, 0, 0, w, h); }
  else c.drawImage(v, sx, sy, sw, sh, x, y, w, h);
  c.restore();
}

function draw(t, dt) {
  const W = S.W, H = S.H, P = H / 2, u = W / 720;
  ctx.fillStyle = '#050a14'; ctx.fillRect(0, 0, W, H);

  // ---- 위: 카메라 원본
  if (ready) cover(ctx, vid, 0, 0, W, P, mirror);
  else {
    ctx.fillStyle = '#4a7a5e'; ctx.font = `${14 * u}px ui-monospace,Menlo,monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('NO SIGNAL', W / 2, P / 2);
  }
  ctx.fillStyle = 'rgba(150,255,190,.6)'; ctx.font = `${12 * u}px ui-monospace,Menlo,monospace`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText('// cam', 12 * u, 10 * u);
  ctx.fillStyle = '#0f2a1a'; ctx.fillRect(0, P - 1, W, 2);

  // ---- 아래: ASCII
  const cols = S.cols, cw = W / cols, chh = cw * 1.7;
  const rows = Math.max(8, Math.floor((P - 6 * u) / chh));
  const gridH = rows * chh, oy = P + (P - gridH) / 2;
  let count = 0;

  if (ready) {
    if (off.width !== cols || off.height !== rows) { off.width = cols; off.height = rows; }
    octx.imageSmoothingEnabled = true;
    cover(octx, vid, 0, 0, cols, rows, mirror, W / gridH);
    const d = octx.getImageData(0, 0, cols, rows).data;
    const n = cols * rows;
    if (!prev || pw !== cols || ph !== rows) { prev = new Float32Array(n * 3).fill(-1); pw = cols; ph = rows; }

    ctx.font = `bold ${chh * 0.98}px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const ramp = SETS[S.set], rn = ramp.length - 1, tt = Math.floor(t / 140);

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const i = r * cols + c, k = i * 4, j = i * 3;
        let R = d[k], G = d[k + 1], B = d[k + 2];
        if (prev[j] < 0) { prev[j] = R; prev[j + 1] = G; prev[j + 2] = B; }
        else {
          R = prev[j] = prev[j] * .55 + R * .45;
          G = prev[j + 1] = prev[j + 1] * .55 + G * .45;
          B = prev[j + 2] = prev[j + 2] * .55 + B * .45;
        }
        let l = (0.299 * R + 0.587 * G + 0.114 * B) / 255;
        l = (l - .5) * S.contrast + .5 + S.bright;
        if (l <= .07) continue;
        if (l > 1) l = 1;
        const idx = Math.round(l * rn);
        if (idx === 0) continue;
        let chr = ramp[idx], color;

        if (S.mode === 0) {            // TREE: 초록 + 반짝이는 장식
          const br = 20 + 55 * l, bg = 75 + 180 * l, bb = 45 + 70 * l;
          color = `rgb(${(br * .62 + R * .38) | 0},${(bg * .62 + G * .38) | 0},${(bb * .62 + B * .38) | 0})`;
          if (l > .5) {
            const h = hash(c, r, tt);
            if (h < .05) { color = SPARK[(h * 1000 | 0) % 4]; chr = '*+o@'[(h * 997 | 0) % 4]; }
          }
        } else if (S.mode === 1) {     // COLOR: 원본 색을 선명하게
          const m = Math.max(R, G, B, 1), f = (70 + 185 * l) / m;
          color = `rgb(${Math.min(255, R * f) | 0},${Math.min(255, G * f) | 0},${Math.min(255, B * f) | 0})`;
        } else if (S.mode === 2) {     // TERMINAL
          color = `rgb(${(20 * l) | 0},${(90 + 165 * l) | 0},${(20 + 60 * l) | 0})`;
        } else {                       // MONO
          const v = (70 + 185 * l) | 0; color = `rgb(${v},${v},${v})`;
        }
        ctx.fillStyle = color;
        ctx.fillText(chr, c * cw + cw / 2, oy + r * chh + chh / 2);
        count++;
      }
    }
  }

  // ---- 눈
  if (S.snow) {
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const p of snow) {
      p.y += p.v * dt; if (p.y > 1) { p.y = 0; p.x = Math.random(); }
      ctx.font = `${(10 + 10 * p.s) * u}px ui-monospace,Menlo,monospace`;
      ctx.fillText(p.s > 1 ? '*' : '.', (p.x + Math.sin(t / 900 + p.s * 9) * .015) * W, P + p.y * P);
    }
  }

  // ---- 아래쪽 어둡게 + 캡션 + 코드창
  const gh = 230 * u;
  const g = ctx.createLinearGradient(0, H - gh, 0, H);
  g.addColorStop(0, 'rgba(5,10,20,0)'); g.addColorStop(.55, 'rgba(5,10,20,.8)'); g.addColorStop(1, 'rgba(5,10,20,.95)');
  ctx.fillStyle = g; ctx.fillRect(0, H - gh, W, gh);

  const cap = S.caption.trim();
  if (cap) {
    const lines = cap.split('\n').slice(0, 3);
    let fs = 46 * u;
    ctx.font = `800 ${fs}px "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif`;
    const widest = () => Math.max(...lines.map(s => ctx.measureText(s).width));
    while (widest() > W - 56 * u && fs > 16 * u) { fs -= 2 * u; ctx.font = `800 ${fs}px "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif`; }
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.shadowColor = 'rgba(0,0,0,.85)'; ctx.shadowBlur = 14 * u;
    ctx.fillStyle = '#fff';
    const baseY = H - 150 * u;
    lines.forEach((s, i) => ctx.fillText(s, 28 * u, baseY - (lines.length - 1 - i) * fs * 1.15));
    ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  }

  ctx.font = `${14 * u}px ui-monospace,Menlo,Consolas,monospace`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const li = Math.floor(t / 1700), lh = 22 * u;
  for (let i = 0; i < 4; i++) {
    const idx = (li + i) % CODE.length, y = H - 22 * u - (3 - i) * lh;
    ctx.fillStyle = 'rgba(120,200,150,.28)'; ctx.fillText(String(100 + idx), 28 * u, y);
    ctx.fillStyle = 'rgba(160,230,190,.5)';
    ctx.fillText(CODE[idx] + (i === 3 && (t % 900 < 450) ? '▌' : ''), 28 * u + 44 * u, y);
  }

  // ---- HUD
  ctx.font = `${12 * u}px ui-monospace,Menlo,Consolas,monospace`;
  ctx.textBaseline = 'top'; ctx.fillStyle = 'rgba(150,255,190,.55)';
  ctx.textAlign = 'left';  ctx.fillText(`letters ${count.toLocaleString()}`, 12 * u, P + 10 * u);
  ctx.textAlign = 'right'; ctx.fillText(`running · ${fps} fps`, W - 12 * u, P + 10 * u);
}

function loop(t) {
  requestAnimationFrame(loop);
  if (t - lastT < 30) return;
  const dt = Math.min(.1, (t - lastT) / 1000); lastT = t;
  fCount++;
  if (t - fTime >= 1000) { fps = Math.round(fCount * 1000 / (t - fTime)); fCount = 0; fTime = t; }
  draw(t, dt);
}
requestAnimationFrame(loop);

// ---------- 카메라 ----------
const errEl = $('#err');
function showErr(msg) { errEl.textContent = msg; errEl.style.display = 'block'; $('#start').style.display = 'flex'; }

async function startCam() {
  errEl.style.display = 'none';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showErr('카메라는 HTTPS 주소에서만 켜져요. GitHub Pages 같은 https 주소로 열어 주세요.'); return;
  }
  try {
    if (stream) stream.getTracks().forEach(tr => tr.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: S.facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    vid.srcObject = stream;
    await vid.play();
    mirror = S.facing === 'user';
    ready = true; prev = null;
    $('#start').style.display = 'none';
  } catch (e) {
    ready = false;
    showErr(e && e.name === 'NotAllowedError'
      ? '카메라 권한이 막혀 있어요. 브라우저 설정에서 카메라를 허용해 주세요.'
      : '카메라를 켜지 못했어요. 다른 앱이 카메라를 쓰고 있는지 확인해 주세요.');
  }
}
$('#go').onclick = startCam;
$('#bFlip').onclick = () => { S.facing = S.facing === 'user' ? 'environment' : 'user'; startCam(); };

// ---------- 옵션 ----------
$('#bMode').onclick = () => { S.mode = (S.mode + 1) % MODES.length; $('#lMode').textContent = MODES[S.mode]; };
$('#bSet').onclick = () => { S.set = (S.set + 1) % SETS.length; $('#lSet').textContent = SET_LABELS[S.set]; };
$('#bCfg').onclick = () => $('#drawer').classList.toggle('open');
$('#sCols').oninput = e => { S.cols = +e.target.value; $('#oCols').textContent = S.cols; prev = null; };
$('#sCon').oninput = e => { S.contrast = +e.target.value; $('#oCon').textContent = S.contrast.toFixed(2); };
$('#sBri').oninput = e => { S.bright = +e.target.value; $('#oBri').textContent = S.bright.toFixed(2); };
$('#tCap').oninput = e => { S.caption = e.target.value; };
$('#segQ').onclick = e => {
  const b = e.target.closest('button'); if (!b || rec) return;
  [...$('#segQ').children].forEach(x => x.classList.toggle('on', x === b));
  setSize(+b.dataset.w);
};
$('#segSnow').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#segSnow').children].forEach(x => x.classList.toggle('on', x === b));
  S.snow = b.dataset.v === '1';
};

// ---------- 결과 / 저장 ----------
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', 2600);
}
let curBlob = null, curUrl = null, curName = '';
function stamp() { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }

function showResult(kind, blob) {
  if (curUrl) URL.revokeObjectURL(curUrl);
  curBlob = blob; curUrl = URL.createObjectURL(blob);
  const ext = kind === 'image' ? 'png' : (blob.type.includes('mp4') ? 'mp4' : 'webm');
  curName = `ascii-cam-${stamp()}.${ext}`;
  const box = $('#mediaBox'); box.innerHTML = '';
  let el;
  if (kind === 'image') { el = document.createElement('img'); el.src = curUrl; }
  else { el = document.createElement('video'); el.src = curUrl; el.controls = true; el.loop = true; el.muted = true; el.autoplay = true; el.playsInline = true; }
  el.className = 'media'; box.appendChild(el);
  $('#mHint').textContent = kind === 'image'
    ? '저장 버튼을 누르거나, 이미지를 길게 눌러 저장해도 돼요.'
    : (ext === 'webm' ? '이 브라우저는 webm으로 저장돼요. 인스타가 안 받으면 화면 녹화를 이용해 주세요.' : '저장하거나 공유 창에서 인스타를 골라 올려요.');
  $('#modal').classList.add('open');
}
$('#mClose').onclick = () => { $('#modal').classList.remove('open'); $('#mediaBox').innerHTML = ''; };
$('#mSave').onclick = async () => {
  if (!curBlob) return;
  const file = new File([curBlob], curName, { type: curBlob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = curUrl; a.download = curName;
  document.body.appendChild(a); a.click(); a.remove();
  toast('저장했어요');
};

$('#bShot').onclick = () => {
  if (!ready) { toast('먼저 카메라를 켜 주세요'); return; }
  cv.toBlob(b => b ? showResult('image', b) : toast('사진을 만들지 못했어요'), 'image/png');
};

// ---------- 녹화 ----------
let rec = null, chunks = [], recStart = 0, recTimer = null;
const MAX_SEC = 60;
function pickMime() {
  const list = ['video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  return list.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
}
function fmt(s) { return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; }
function stopRec() { if (rec && rec.state !== 'inactive') rec.stop(); }

$('#bRec').onclick = () => {
  const btn = $('#bRec');
  if (rec) { stopRec(); return; }
  if (!ready) { toast('먼저 카메라를 켜 주세요'); return; }
  if (!window.MediaRecorder || !cv.captureStream) { toast('이 브라우저는 녹화를 지원하지 않아요. 화면 녹화를 이용해 주세요'); return; }
  const mime = pickMime();
  try {
    rec = new MediaRecorder(cv.captureStream(30), mime ? { mimeType: mime, videoBitsPerSecond: 6e6 } : { videoBitsPerSecond: 6e6 });
  } catch (e) { rec = null; toast('녹화를 시작하지 못했어요'); return; }
  chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    clearInterval(recTimer);
    const type = rec.mimeType || mime || 'video/webm';
    rec = null;
    btn.textContent = '녹화 시작'; btn.classList.remove('recording');
    if (chunks.length) showResult('video', new Blob(chunks, { type }));
  };
  rec.start(250);
  recStart = Date.now();
  btn.classList.add('recording'); btn.textContent = '■ 00:00 · 누르면 끝';
  recTimer = setInterval(() => {
    const s = Math.floor((Date.now() - recStart) / 1000);
    btn.textContent = `■ ${fmt(s)} · 누르면 끝`;
    if (s >= MAX_SEC) stopRec();
  }, 250);
};
})();
</script>
</body>
</html>
